<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C641C"/>
      <stop offset="28%" stop-color="#F4D58A"/>
      <stop offset="50%" stop-color="#FFF2B8"/>
      <stop offset="72%" stop-color="#C99732"/>
