<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B641F"/>
      <stop offset="28%" stop-color="#D8B45A"/>
      <stop offset="50%" stop-color="#F7E5A0"/>
      <stop offset="72%" stop-color="#C99B3E"/>
      <stop offset="100%" stop-color="#8B641F"/>
    </linearGradient>

    <linearGradient id="gold2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#A87522"/>
      <stop offset="50%" stop-color="#F4D77C"/>
      <stop offset="100%" stop-color="#A87522"/>
    </linearGradient>
  </defs>

  <!-- Deep luxury background -->
  <rect
    width="512"
    height="512"
    rx="96"
    fill="#070707"
  />

  <!-- Thin couture frame -->
  <rect
    x="28"
    y="28"
    width="456"
    height="456"
    rx="82"
    fill="none"
    stroke="url(#gold)"
    stroke-width="5"
  />

  <!-- Inner frame -->
  <rect
    x="43"
    y="43"
    width="426"
    height="426"
    rx="70"
    fill="none"
    stroke="#D8B45A"
    stroke-opacity=".22"
    stroke-width="2"
  />

  <!-- Integrated crown -->
  <path
    d="
      M170 181
      L188 126
      L225 155
      L256 111
      L287 155
      L324 126
      L342 181
      Z
    "
    fill="none"
    stroke="url(#gold2)"
    stroke-width="10"
    stroke-linejoin="round"
  />

  <!-- Crown base -->
  <path
    d="M174 181 Q256 203 338 181"
    fill="none"
    stroke="url(#gold2)"
    stroke-width="9"
    stroke-linecap="round"
  />

  <!-- K -->
  <path
    d="
      M145 238
      L145 399

      M145 322
      L230 238

      M178 316
      L242 399
    "
    fill="none"
    stroke="url(#gold)"
    stroke-width="25"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- Q -->
  <path
    d="
      M321 239
      C274 239 247 271 247 319
      C247 368 274 399 321 399
      C368 399 395 368 395 319
      C395 271 368 239 321 239
      Z
    "
    fill="none"
    stroke="url(#gold)"
    stroke-width="24"
  />

  <!-- Q tail -->
  <path
    d="
      M349 367
      L405 416
    "
    fill="none"
    stroke="url(#gold)"
    stroke-width="23"
    stroke-linecap="round"
  />

  <!-- Small couture divider -->
  <path
    d="M203 424 H309"
    stroke="#D8B45A"
    stroke-width="3"
    stroke-linecap="round"
    opacity=".7"
  />

</svg>